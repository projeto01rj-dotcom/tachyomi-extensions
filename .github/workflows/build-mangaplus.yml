name: Build Manga Plus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mangaplus
  cancel-in-progress: false

jobs:
  build:
    name: Compilar e publicar Manga Plus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Manga Plus
        run: ./gradlew :src:all:mangaplus:assembleRelease --stacktrace

      - name: Preparar catálogo atual
        run: |
          set -e
          rm -rf repo-branch
          mkdir repo-branch
          git archive origin/repo | tar -x -C repo-branch

      - name: Mesclar Manga Plus no catálogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path.cwd()
          catalog = root / "repo-branch"
          info_files = list((root / "src/all/mangaplus/build").glob("keiyoushi-source-info.json"))
          if len(info_files) != 1:
              raise SystemExit("Informações da Manga Plus não encontradas")
          info = json.loads(info_files[0].read_text())
          apk_files = list((root / "src/all/mangaplus/build/outputs/apk/release").glob("*.apk"))
          if len(apk_files) != 1:
              raise SystemExit("APK da Manga Plus não encontrado")

          pkg = info["packageName"]
          apk = apk_files[0]
          icon = root / "src/all/mangaplus/res/mipmap-xhdpi/ic_launcher.png"
          if not icon.is_file():
              raise SystemExit("Ícone da Manga Plus não encontrado")

          (catalog / "apk").mkdir(parents=True, exist_ok=True)
          (catalog / "icon").mkdir(parents=True, exist_ok=True)
          shutil.copy2(apk, catalog / "apk" / apk.name)
          shutil.copy2(icon, catalog / "icon" / f"{pkg}.png")

          entry = {
              "name": info["name"],
              "pkg": pkg,
              "apk": apk.name,
              "lang": info["module"].split("/")[0],
              "code": info["versionCode"],
              "version": info["versionName"],
              "nsfw": 1 if info["contentWarning"] == 3 else 0,
              "sources": [
                  {"id": int(s["id"]), "lang": s["lang"], "name": s["name"], "baseUrl": s["baseUrl"]}
                  for s in info["sources"]
              ],
          }

          index = json.loads((catalog / "index.json").read_text())
          index = [item for item in index if item.get("pkg") != pkg]
          index.append(entry)
          index.sort(key=lambda item: item["pkg"])
          (catalog / "index.json").write_text(json.dumps(index, indent=2, ensure_ascii=False) + "\n")
          (catalog / "index.min.json").write_text(json.dumps(index, separators=(",", ":"), ensure_ascii=False))
          PY

      - name: Publicar branch repo
        run: |
          set -e
          cd repo-branch
          git init -b repo
          git config user.name "tachyomi-extensions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "Publicar Manga Plus no catálogo"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git push --force origin repo
