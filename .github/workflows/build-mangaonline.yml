name: Build Manga Online

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/pt/mangaonline/**'
      - '.github/workflows/build-mangaonline.yml'
      - 'core/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mangaonline
  cancel-in-progress: false

jobs:
  build-mangaonline:
    name: Compilar Manga Online
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Garantir plataforma Android
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            yes | sdkmanager --channel=0 "platforms;android-37.0" "build-tools;36.1.0"
          fi

      - name: Compilar somente Manga Online
        run: |
          set -o pipefail
          ./gradlew :src:pt:mangaonline:assembleRelease --stacktrace 2>&1 | tee mangaonline-build.log

      - name: Upload APK da Manga Online
        uses: actions/upload-artifact@v4
        with:
          name: mangaonline-apk
          path: |
            src/pt/mangaonline/build/outputs/apk/release/*.apk
            src/pt/mangaonline/build/keiyoushi-source-info.json
          if-no-files-found: error
