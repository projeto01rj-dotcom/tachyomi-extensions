name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Compilar extensões
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build de todas as extensões
        run: |
          ./gradlew \
            :src:all:mangadex:assembleRelease \
            :src:pt:mangaonline:assembleRelease \
            :src:pt:noxmangas:assembleRelease \
            :src:pt:saikaiscan:assembleRelease \
            --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/keiyoushi-source-info.json
          if-no-files-found: error

      - name: Preparar e publicar branch repo
        run: |
          python .github/scripts/publish_index.py repo-branch
          cd repo-branch
          git init -b repo
          git config user.name "tachyomi-extensions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "Atualizar repositório de extensões"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          git push --force origin repo