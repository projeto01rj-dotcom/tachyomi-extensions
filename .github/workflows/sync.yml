name: Sync do catálogo das fontes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sincronizar catálogo (30 min)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Sincronizar fontes
        run: python scripts/sync_catalog.py --repo-dir "$GITHUB_WORKSPACE" --out catalog

      - name: Abrir issues para mangás removidos pelas fontes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/open_removal_issues.py --out catalog --repo "${{ github.repository }}"

      - name: Alimentar resumo do commit
        id: summary
        run: |
          RESUMO=$(jq -r '.sources | to_entries | map(if .value.ok then "\(.key): \(.value.present) obras (+\(.value.added) / -\(.value.removed))" else "\(.key): falhou (\(.value.error // "?"))" end) | join(" | ")' catalog/last_run.json)
          echo "RESUMO=$RESUMO" >> "$GITHUB_OUTPUT"

      - name: Commit e push do catálogo
        env:
          RESUMO: ${{ steps.summary.outputs.RESUMO }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          if git diff --cached --quiet; then
            echo "Sem alterações no catálogo."
          else
            git commit -m "sync: $RESUMO"
            git push
          fi